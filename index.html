<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>校園開放日 - 電腦硬件 AR 展覽</title>
  <!-- 1. 引入 A-Frame 核心庫 (v1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- 2. 引入 MindAR 影像追蹤庫 (v1.2.5) -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <!-- 3. 引入 aframe-extras 播放 glTF 內置骨骼/位移动畫 (如 ssd.glb) -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    /* 全域基礎樣式重置 */
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background-color: #0d1117;
      color: #ffffff;
    /* 確保 AR 畫布置底 */
    a-scene {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    /* ===================================================
       UI 覆蓋層容器 (解決圖層遮擋與點擊失靈關鍵)
       =================================================== */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none; /* 允許穿透到場景，只在子元素開啟點擊 */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
    /* 頂部功能列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: auto;
      max-width: 600px;
      margin: 10px auto 0 auto;
      width: calc(100% - 20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    .top-bar h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    .status-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(56, 139, 253, 0.15);
      color: #79c0ff;
      border: 1px solid rgba(56, 139, 253, 0.3);
    /* 底部硬件解說資訊視窗 (UI Overlay) */
    .info-card-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto 12px auto;
      pointer-events: auto;
    .info-card {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(88, 166, 255, 0.25);
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    .info-card.active {
      border-color: #58a6ff;
      box-shadow: 0 8px 32px rgba(56, 139, 253, 0.35);
      background: rgba(13, 27, 46, 0.9);
    .info-title {
      font-size: 17px;
      font-weight: bold;
      color: #58a6ff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    .info-desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: #e6edf3;
      letter-spacing: 0.2px;
    /* ===================================================
       啟動畫面與加載進度視窗 (全屏阻擋層)
       =================================================== */
    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: radial-gradient(circle at center, #161b22 0%, #090d13 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      transition: opacity 0.5s ease, visibility 0.5s;
    .start-box {
      max-width: 440px;
      width: 100%;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    .icon-hero {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    .start-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    .start-desc {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 24px;
    /* 顯眼的啟動按鈕 */
    .btn-primary {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(31, 111, 235, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(31, 111, 235, 0.3);
    .btn-primary:disabled {
      background: #30363d;
      color: #8b949e;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    /* 旋轉加載環 */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    @keyframes spin {
      to { transform: rotate(360deg); }
    /* 伺服器協議警告提示 (針對電腦直接點開 index.html) */
    .protocol-warning {
      display: none;
      margin-top: 16px;
      padding: 12px;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      border-radius: 10px;
      font-size: 12.5px;
      color: #ff7b72;
      text-align: left;
      line-height: 1.5;
    /* 電腦端提示小徽章 */
    .desktop-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #58a6ff;
  </style>
</head>
<body>
  <!-- ===================================================
       1. 啟動與載入遮罩層 (避免啟動前主線程凍結)
       =================================================== -->
  <div id="start-screen" class="start-screen">
    <div class="start-box">
      <div class="icon-hero">💻</div>
      <h2 class="start-title">電腦硬件 AR 互動展覽</h2>
      <p class="start-desc">
        歡迎參觀！點擊下方按鈕啟動相機，將鏡頭對準展板上的硬件照片，即可召喚 3D 全息立體模型及解說。
      </p>
      <!-- 核心啟動按鈕 -->
      <button id="btn-start-ar" class="btn-primary">
        <span>開啟 AR 相機體驗</span>
      </button>
      <!-- 本地 file:// 協議阻斷提示 (電腦常見問題) -->
      <div id="protocol-warning" class="protocol-warning">
        ⚠️ <strong>偵測到本地檔案協議 (file://)</strong><br>
        瀏覽器因安全性原則禁止直接調用相機。請使用 <strong>VS Code Live Server</strong>、<strong>npx serve</strong> 或將檔案上傳至 GitHub Pages (HTTPS) 預覽。
      </div>
      <div class="desktop-hint">💡 支援電腦 WebCam、iPad 及各款智能手機</div>
    </div>
  </div>
  <!-- ===================================================
       2. 前端響應式 UI 層 (置頂與置底視窗)
       =================================================== -->
  <div class="ui-layer" id="ui-layer">
    <!-- 頂部標題狀態列 -->
    <div class="top-bar">
      <h1><span>🔍</span> 硬件 AR 探測器</h1>
      <span id="scan-status" class="status-badge">等待相機...</span>
    </div>
    <!-- 底部固定解說視窗 -->
    <div class="info-card-container">
      <div id="info-card" class="info-card">
        <div id="info-title" class="info-title">✨ 準備就緒</div>
        <div id="info-desc" class="info-desc">請將相機對準展板上的硬件圖片...</div>
      </div>
    </div>
  </div>
  <!-- ===================================================
       3. A-Frame + MindAR 3D 場景
       重要配置：autoStart: false 防止頁面卡死，等待點擊才加載
       =================================================== -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true, physicallyCorrectLights: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <!-- 靜態資源預載 (3D 模型 .glb) -->
    <a-assets timeout="30000">
      <a-asset-item id="model-cpu" src="cpu.glb"></a-asset-item>
      <a-asset-item id="model-gpu" src="gpu.glb"></a-asset-item>
      <a-asset-item id="model-psu" src="psu.glb"></a-asset-item>
      <a-asset-item id="model-hdd" src="hdd.glb"></a-asset-item>
      <a-asset-item id="model-ssd" src="ssd.glb"></a-asset-item>
      <a-asset-item id="model-ram" src="ram.glb"></a-asset-item>
      <a-asset-item id="model-motherboard" src="motherboard.glb"></a-asset-item>
    </a-assets>
    <!-- 環境光與主方向光源，確保電腦和手機上模型皆清晰立體 -->
    <a-light type="ambient" intensity="1.4" color="#ffffff"></a-light>
    <a-light type="directional" intensity="1.6" position="2 4 3" color="#ffffff"></a-light>
    <!-- AR 相機實體 -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- ===================================================
         4. 七大硬件追蹤目標 (Target Index: 0 ~ 6)
         =================================================== -->
    <!-- 目標 0: CPU -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-cpu" data-id="cpu">
      <a-gltf-model src="#model-cpu" position="0 0 0.1" rotation="0 0 0" scale="0.25 0.25 0.25"></a-gltf-model>
    </a-entity>
    <!-- 目標 1: GPU -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-gpu" data-id="gpu">
      <a-gltf-model src="#model-gpu" position="0 0 0.1" rotation="0 0 0" scale="0.25 0.25 0.25"></a-gltf-model>
    </a-entity>
    <!-- 目標 2: PSU -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-psu" data-id="psu">
      <a-gltf-model src="#model-psu" position="0 0 0.1" rotation="0 0 0" scale="0.22 0.22 0.22"></a-gltf-model>
    </a-entity>
    <!-- 目標 3: HDD -->
    <a-entity mindar-image-target="targetIndex: 3" id="target-hdd" data-id="hdd">
      <a-gltf-model src="#model-hdd" position="0 0 0.1" rotation="0 0 0" scale="0.24 0.24 0.24"></a-gltf-model>
    </a-entity>
    <!-- 目標 4: SSD (帶有數據光效動畫，使用 animation-mixer) -->
    <a-entity mindar-image-target="targetIndex: 4" id="target-ssd" data-id="ssd">
      <a-gltf-model src="#model-ssd" position="0 0 0.1" rotation="0 0 0" scale="0.25 0.25 0.25" animation-mixer="clip: *; loop: repeat;"></a-gltf-model>
    </a-entity>
    <!-- 目標 5: RAM -->
    <a-entity mindar-image-target="targetIndex: 5" id="target-ram" data-id="ram">
      <a-gltf-model src="#model-ram" position="0 0 0.1" rotation="0 0 0" scale="0.25 0.25 0.25"></a-gltf-model>
    </a-entity>
    <!-- 目標 6: Motherboard -->
    <a-entity mindar-image-target="targetIndex: 6" id="target-motherboard" data-id="motherboard">
      <a-gltf-model src="#model-motherboard" position="0 0 0.1" rotation="0 0 0" scale="0.2 0.2 0.2"></a-gltf-model>
    </a-entity>
  </a-scene>
  <!-- ===================================================
       5. 核心邏輯腳本
       =================================================== -->
  <script>
    // 硬件解說文字數據庫
    const HARDWARE_DATA = {
      default: {
        title: "✨ 正在搜尋目標...",
        desc: "請將相機對準展板上的硬件圖片..."
      cpu: {
        title: "⚡ 中央處理器 (CPU)",
        desc: "【中央處理器 (CPU)】電腦的大腦，負責執行程式指令與運算所有核心數據。"
      gpu: {
        title: "🎮 顯示卡 (GPU)",
        desc: "【顯示卡 (GPU)】圖形運算核心，負責渲染精美畫面、3D 遊戲及加速 AI 運算。"
      psu: {
        title: "🔋 電源供應器 (PSU)",
        desc: "【電源供應器 (PSU)】電腦的心臟，將家用交流電轉換為穩定的直流電，供電給全機運作。"
      hdd: {
        title: "💾 傳統硬碟 (HDD)",
        desc: "【傳統硬碟 (HDD)】高容量儲存裝置，利用磁性盤片記錄數據，適合儲存大量非即時讀取的檔案。"
      ssd: {
        title: "🚀 固態硬碟 (SSD)",
        desc: "【固態硬碟 (SSD)】高速儲存裝置，採用快閃記憶體技術，能秒速啟動系統與載入遊戲。"
      ram: {
        title: "🧠 隨機存取記憶體 (RAM)",
        desc: "【隨機存取記憶體 (RAM)】臨時工作台，暫存 CPU 運算中的數據，容量越大越能流暢進行多任務切換。"
      motherboard: {
        title: "🔌 主機板 (Motherboard)",
        desc: "【主機板 (Motherboard)】電腦的骨幹與橋樑，佈滿精密電路，負責連接並協調所有硬件運作。"
    // DOM 元素引用
    const startScreen = document.getElementById('start-screen');
    const btnStart = document.getElementById('btn-start-ar');
    const protocolWarning = document.getElementById('protocol-warning');
    const infoCard = document.getElementById('info-card');
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');
    const scanStatus = document.getElementById('scan-status');
    const sceneEl = document.getElementById('ar-scene');
    // 檢查運行協議 (避免在電腦直接以 file:// 打開而無法開啟相機)
    if (window.location.protocol === 'file:') {
      protocolWarning.style.display = 'block';
    // 更新 UI 文字函式
    function updateHardwareInfo(key) {
      const data = HARDWARE_DATA[key] || HARDWARE_DATA.default;
      infoTitle.textContent = data.title;
      infoDesc.textContent = data.desc;
      if (key !== 'default') {
        infoCard.classList.add('active');
        scanStatus.textContent = "已鎖定目標";
        scanStatus.style.background = "rgba(46, 160, 67, 0.2)";
        scanStatus.style.color = "#3fb950";
        scanStatus.style.borderColor = "rgba(46, 160, 67, 0.4)";
      } else {
        infoCard.classList.remove('active');
        scanStatus.textContent = "尋找硬件中...";
        scanStatus.style.background = "rgba(56, 139, 253, 0.15)";
        scanStatus.style.color = "#79c0ff";
        scanStatus.style.borderColor = "rgba(56, 139, 253, 0.3)";
    // 啟動按鈕點擊處理
    btnStart.addEventListener('click', async () => {
      // 1. 馬上將按鈕轉為加載狀態，禁止重複點擊
      btnStart.disabled = true;
      btnStart.innerHTML = `<span class="spinner"></span><span>啟動 AR 引擎與鏡頭中...</span>`;
      try {
        // 確保 A-Frame 場景加載完成
        if (!sceneEl.hasLoaded) {
          await new Promise(resolve => sceneEl.addEventListener('loaded', resolve, { once: true }));
        // 取得 MindAR 系統
        const arSystem = sceneEl.systems['mindar-image-system'];
        if (!arSystem) {
          throw new Error("無法載入 MindAR 系統組件，請確認 CDN 網絡連線。");
        // 啟動 AR 追蹤系統 (此過程會請求相機與編譯 targets.mind)
        await arSystem.start();
        // 隱藏啟動畫面
        startScreen.style.opacity = '0';
        setTimeout(() => {
          startScreen.style.display = 'none';
        }, 500);
        updateHardwareInfo('default');
      } catch (err) {
        console.error("AR 啟動失敗:", err);
        btnStart.disabled = false;
        btnStart.innerHTML = `<span>重試開啟 AR 相機</span>`;
        alert("無法啟動相機：\n1. 請確認已允許瀏覽器使用相機權限。\n2. 若使用電腦，請確認已連接 WebCam 並以 http://localhost 或 HTTPS 伺服器方式運行。\n錯誤訊息: " + err.message);
    // 監聽各硬件目標的識別與丟失事件
    const targets = document.querySelectorAll('[mindar-image-target]');
    targets.forEach(target => {
      const hardwareId = target.getAttribute('data-id');
      // 成功識別 targetFound
      target.addEventListener('targetFound', () => {
        updateHardwareInfo(hardwareId);
      // 移開鏡頭 / 丟失目標 targetLost
      target.addEventListener('targetLost', () => {
        updateHardwareInfo('default');
  </script>
</body>
</html>
